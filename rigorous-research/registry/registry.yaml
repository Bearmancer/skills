# Routing registry: source of truth for surfaces. references/routing.md and fleet.md are generated from this file
# (scripts/gen_routing_table.py). Surface id = <server>.<capability>.
# Routes are CLI-only (ADR 0035): vendor CLI, then POST script, then local/http. No MCP routes.
# Fallback inside a server is never a new surface. `auth` says how the CLI authenticates when it is not just `key.env`.
schema: 1

# Rotation paradigms for discovery rounds. Round N must use a paradigm not used in earlier rounds.
paradigms: [
  keyword,
  semantic,
  answer-agent,
  scholarly-archive,
  crawl-map,
  browser-unlocker,
  structured-extraction,
]
round_order:
  - [keyword]
  - [semantic]
  - [answer-agent]
  - [scholarly-archive]
  - [crawl-map, browser-unlocker]
max_rounds: 5

# Fetch ladder: escalate per URL on block, cheap to expensive.
fetch_ladder:
  - direct.fetch
  - tavily.extract
  - firecrawl.scrape
  - exa.fetch
  - wayback.fetch
  - scrapegraph.scrape
  - zenrows.fetch
  - tinyfish.fetch
  - brightdata.scrape
  - apify.rag-web-browser

# Source tiers by type. Per-domain overrides go in tier_overrides.
tiers:
  T1: [
    rulebook,
    official-data,
    original-document,
    peer-reviewed,
    designer-post,
    publisher-post,
    direct-record,
  ]
  T2: [established-outlet, reference-work, quality-journalism]
  T3: [forum, blog, social, unknown]
tier_overrides: {}

servers:
  direct:
    pool: null
    wired: true
    keyed: false
    capabilities:
      fetch: {
        paradigm: crawl-map,
        ladder: fetch,
        cost: low,
        routes: { http: ["GET <url>"] },
      }

  tavily:
    pool: tavily
    auth: "TAVILY_API_KEY (`tvly auth` confirms)"
    wired: true
    keyed: true
    key: {
      env: TAVILY_API_KEY,
      pattern: "^(?P<acct>[A-Z0-9]+)_TAVILY_API_KEY$",
      header: "Authorization",
      prefix: "Bearer ",
      base_url: "https://api.tavily.com",
    }
    reset: monthly # https://help.tavily.com/articles/6846808029-understanding-api-credits-reset (first day of each month)
    capabilities:
      search: {
        paradigm: keyword,
        ladder: discovery,
        cost: low,
        routes: { cli: ["tvly search"] },
      }
      extract: {
        paradigm: crawl-map,
        ladder: fetch,
        cost: low,
        routes: { cli: ["tvly extract"] },
      }
      crawl: {
        paradigm: crawl-map,
        ladder: discovery,
        cost: med,
        routes: { cli: ["tvly crawl", "tvly map"] },
      }
      research: {
        paradigm: answer-agent,
        ladder: discovery,
        cost: high,
        routes: { cli: ["tvly research"] },
      }
    errors:
      blocked: ["failed to fetch url"]
    unverified: [bad_key, out_of_credit, rate_limit]

  exa:
    pool: exa
    auth: "EXA_API_KEY (POST scripts only; exa has no CLI)"
    wired: true
    keyed: true
    key: {
      env: EXA_API_KEY,
      pattern: "^(?P<acct>[A-Z0-9]+)_EXA_API_KEY$",
      header: "x-api-key",
      prefix: "",
      base_url: "https://api.exa.ai",
    }
    reset: monthly # https://exa.ai/docs/reference/billing (monthly credits expire at month end)
    capabilities:
      search: {
        paradigm: semantic,
        ladder: discovery,
        cost: low,
        routes: {
          post: [
            "uv run <skill dir>/scripts/post/vendor_request.py exa POST /search --body <json|@file>",
          ],
        },
      }
      fetch: {
        paradigm: crawl-map,
        ladder: fetch,
        cost: low,
        routes: {
          post: [
            "uv run <skill dir>/scripts/post/vendor_request.py exa POST /contents --body <json|@file>",
          ],
        },
      }
      answer: {
        paradigm: answer-agent,
        ladder: discovery,
        cost: med,
        routes: {
          post: [
            "uv run <skill dir>/scripts/post/vendor_request.py exa POST /answer --body <json|@file>",
          ],
        },
      }
      agent: {
        paradigm: answer-agent,
        ladder: discovery,
        cost: high,
        routes: {
          post: [
            "uv run <skill dir>/scripts/post/vendor_request.py exa POST /agent/runs --body <json|@file>",
            "uv run <skill dir>/scripts/post/vendor_request.py exa GET /agent/runs/<run_id>",
            "uv run <skill dir>/scripts/post/exa_agent_run.py stop|cancel <run_id>",
            "uv run <skill dir>/scripts/post/exa_batches.py start|status|cancel",
          ],
        },
      }
    errors:
      bad_key: ["401"]
      out_of_credit: ["402"]
      blocked: ["source_not_available"]
      rate_limit: ["429"]

  firecrawl:
    pool: firecrawl
    auth: "FIRECRAWL_API_KEY (wins over the stored login; `firecrawl status` confirms)"
    wired: true
    keyed: true
    key: {
      env: FIRECRAWL_API_KEY,
      pattern: "^(?P<acct>[A-Z0-9]+)_(FIRECRAWL|FIRECRAWLER)_API_KEY$",
      header: "Authorization",
      prefix: "Bearer ",
      base_url: "https://api.firecrawl.dev/v2",
    }
    reset: monthly # https://docs.firecrawl.dev/billing (plan credits do not roll over)
    capabilities:
      search: {
        paradigm: keyword,
        ladder: discovery,
        cost: low,
        routes: { cli: ["firecrawl search"] },
      }
      scrape: {
        paradigm: crawl-map,
        ladder: fetch,
        cost: low,
        routes: { cli: ["firecrawl scrape <url>"] },
      }
      crawl: {
        paradigm: crawl-map,
        ladder: discovery,
        cost: med,
        routes: { cli: ["firecrawl crawl", "firecrawl map"] },
      }
      batch-scrape: {
        paradigm: crawl-map,
        ladder: fetch,
        cost: med,
        routes: {
          post: [
            "uv run <skill dir>/scripts/post/firecrawl_batch_scrape.py start|status|cancel|errors",
          ],
        },
      }
      agent: {
        paradigm: answer-agent,
        ladder: discovery,
        cost: high,
        routes: { cli: ["firecrawl agent"] },
      }
      research: {
        paradigm: scholarly-archive,
        ladder: discovery,
        cost: low,
        routes: { cli: ["firecrawl research"] },
      }
    errors:
      bad_key: ["401"]
      out_of_credit: ["402"]
      blocked: ["403"]
      rate_limit: ["429"]

  scrapegraph:
    pool: scrapegraph
    auth: "SGAI_API_KEY (just-scrape); debug with SGAI_DEBUG=1, history with `just-scrape history scrape --json`"
    wired: true
    keyed: true
    key: {
      env: SGAI_API_KEY,
      pattern: "^(?P<acct>[A-Z0-9]+)_(SCRAPEGRAPH|SCRAPEGRAPHAI)_API_KEY$",
      header: "SGAI-APIKEY",
      prefix: "",
      base_url: "https://v2-api.scrapegraphai.com/api",
    }
    reset: unknown # no vendor doc found stating the free-credit reset (docs.scrapegraphai.com pricing page unclear)
    capabilities:
      search: {
        paradigm: keyword,
        ladder: discovery,
        cost: med,
        routes: { cli: ["just-scrape search"] },
      }
      scrape: {
        paradigm: structured-extraction,
        ladder: fetch,
        cost: med,
        routes: { cli: ["just-scrape scrape <url>"] },
      }
      crawl: {
        paradigm: crawl-map,
        ladder: discovery,
        cost: high,
        routes: {
          cli: ["just-scrape crawl"],
          post: [
            "uv run <skill dir>/scripts/post/scrapegraph_crawl.py start|status|stop|resume|delete|pages",
          ],
        },
      }
    errors:
      bad_key: ["401", "auth_missing_key", "403", "auth_invalid_key"]
      out_of_credit: ["402", "insufficient_credits"]
      rate_limit: ["429", "rate_limited"]
    unverified: [blocked]

  apify:
    pool: apify
    auth: "APIFY_TOKEN (`apify info` reports token source env; no ~/.apify/auth.json: never run `apify login`)"
    wired: true
    keyed: true
    key: {
      env: APIFY_TOKEN,
      pattern: "^(?P<acct>[A-Z0-9]+)_APIFY_TOKEN$",
      header: "Authorization",
      prefix: "Bearer ",
      base_url: "https://api.apify.com/v2",
    }
    reset: monthly # https://docs.apify.com/account/subscriptions (prepaid usage resets every billing cycle)
    capabilities:
      rag-web-browser: {
        paradigm: browser-unlocker,
        ladder: fetch,
        cost: med,
        routes: { cli: ["apify actors call apify/rag-web-browser"] },
      }
      actor: {
        paradigm: structured-extraction,
        ladder: fetch,
        cost: high,
        routes: { cli: ["apify actors search", "apify actors call"] },
      }
    errors:
      bad_key: ["401", "invalid-token", "token-not-provided"]
      out_of_credit: [
        "402",
        "not-enough-usage-to-run-paid-actor",
        "monthly-usage-limit-too-low",
      ]
      rate_limit: ["429", "rate-limit-exceeded"]
    unverified: [blocked]

  zenrows:
    pool: zenrows
    wired: true
    keyed: true
    auth: "ZENROWS_API_KEY (no ~/.zenrows/secrets.json: a stored key would win over the env var; never run `zenrows login`)"
    key: {
      env: ZENROWS_API_KEY,
      pattern: "^(?P<acct>[A-Z0-9]+)_ZENROWS_API_KEY$",
      header: null,
      prefix: "",
      base_url: null,
    }
    reset: unknown
    capabilities:
      fetch: {
        paradigm: browser-unlocker,
        ladder: fetch,
        cost: med,
        routes: { cli: ["zenrows fetch <url>"] },
      } # HTML; ~$0.01 per call; run artifacts in ~/.zenrows/runs/<run-id>
    unverified: [bad_key, out_of_credit, blocked, rate_limit]

  tinyfish:
    pool: tinyfish
    wired: true
    keyed: true
    auth: "TINYFISH_API_KEY (overrides a key saved with `tinyfish auth set`); check `tinyfish auth status`"
    key: {
      env: TINYFISH_API_KEY,
      pattern: "^(?P<acct>[A-Z0-9]+)_TINYFISH_API_KEY$",
      header: null,
      prefix: "",
      base_url: null,
    }
    reset: unknown
    capabilities:
      fetch: {
        paradigm: browser-unlocker,
        ladder: fetch,
        cost: med,
        routes: { cli: ["tinyfish fetch content get <url>"] },
      } # JSON: title, author, text (markdown)
    unverified: [bad_key, out_of_credit, blocked, rate_limit]

  brightdata:
    pool: brightdata
    wired: true
    keyed: true
    auth: "BRIGHTDATA_API_KEY plus a Web Unlocker zone: pass --zone or `brightdata config set default_zone_unlocker cli_unlocker`"
    key: {
      env: BRIGHTDATA_API_KEY,
      pattern: "^(?P<acct>[A-Z0-9]+)_BRIGHTDATA_API_KEY$",
      header: null,
      prefix: "",
      base_url: null,
    }
    reset: unknown
    capabilities:
      scrape: {
        paradigm: browser-unlocker,
        ladder: fetch,
        cost: high,
        routes: { cli: ["brightdata scrape <url> --zone cli_unlocker"] },
      } # -f markdown|html|screenshot|json, --country, --mobile, --async, -o
    errors:
      bad_key: ["401", "api key required", "No API key found"]
    unverified: [out_of_credit, blocked, rate_limit]

  browserbase:
    pool: browserbase
    auth: "BROWSERBASE_API_KEY (POST scripts only)"
    wired: true
    keyed: true
    key: {
      env: BROWSERBASE_API_KEY,
      pattern: "^(?P<acct>[A-Z0-9]+)_BROWSERBASE_API_KEY$",
      header: "X-BB-API-Key",
      prefix: "",
      base_url: "https://api.browserbase.com/v1",
    }
    reset: monthly # https://docs.browserbase.com/account/billing/plans (browser hours renew monthly)
    capabilities:
      agent-run: {
        paradigm: browser-unlocker,
        ladder: fetch,
        cost: high,
        routes: {
          post: [
            "uv run <skill dir>/scripts/post/browserbase_agent_run.py start|status",
          ],
        },
      }
    unverified: [bad_key, out_of_credit, blocked, rate_limit]

  microsoft-learn:
    pool: null
    wired: true
    keyed: false
    capabilities:
      docs: {
        paradigm: keyword,
        ladder: discovery,
        cost: low,
        routes: { http: ["GET learn.microsoft.com/api/search?search=<q>", "GET <hit url>"] },
      }

  # Free lawful surfaces (no key).
  openalex:
    pool: null
    wired: true
    keyed: false
    capabilities:
      search: {
        paradigm: scholarly-archive,
        ladder: discovery,
        cost: low,
        routes: { http: ["GET api.openalex.org/works"] },
      }
  crossref:
    pool: null
    wired: true
    keyed: false
    capabilities:
      search: {
        paradigm: scholarly-archive,
        ladder: discovery,
        cost: low,
        routes: { http: ["GET api.crossref.org/works"] },
      }
  semantic-scholar:
    pool: null
    wired: true
    keyed: false
    capabilities:
      search: {
        paradigm: scholarly-archive,
        ladder: discovery,
        cost: low,
        routes: { http: ["GET api.semanticscholar.org/graph/v1/paper/search"] },
      }
  arxiv:
    pool: null
    wired: true
    keyed: false
    capabilities:
      search: {
        paradigm: scholarly-archive,
        ladder: discovery,
        cost: low,
        routes: { http: ["GET export.arxiv.org/api/query"] },
      }
  unpaywall:
    pool: null
    wired: true
    keyed: false
    capabilities:
      lookup: {
        paradigm: scholarly-archive,
        ladder: discovery,
        cost: low,
        routes: { http: ["GET api.unpaywall.org/v2/<doi>"] },
      }
  wayback:
    pool: null
    wired: true
    keyed: false
    capabilities:
      fetch: {
        paradigm: scholarly-archive,
        ladder: fetch,
        cost: low,
        routes: {
          http: [
            "GET archive.org/wayback/available",
            "GET web.archive.org/cdx/search/cdx",
          ],
        },
      }
  internet-archive:
    pool: null
    wired: true
    keyed: false
    capabilities:
      fulltext: {
        paradigm: scholarly-archive,
        ladder: discovery,
        cost: low,
        routes: { http: ["GET archive.org/advancedsearch.php"] },
      }
  wikisource:
    pool: null
    wired: true
    keyed: false
    capabilities:
      search: {
        paradigm: scholarly-archive,
        ladder: discovery,
        cost: low,
        routes: { http: ["GET wikisource.org/w/api.php"] },
      }
  wikipedia:
    pool: null
    wired: true
    keyed: false
    capabilities:
      search: {
        paradigm: keyword,
        ladder: discovery,
        cost: low,
        routes: { http: ["GET wikipedia.org/w/api.php"] },
      }
  wikidata:
    pool: null
    wired: true
    keyed: false
    capabilities:
      query: {
        paradigm: semantic,
        ladder: discovery,
        cost: low,
        routes: { http: ["GET wikidata.org/w/api.php"] },
      }
  bgg:
    pool: null
    wired: true
    keyed: false
    capabilities:
      xmlapi: {
        paradigm: scholarly-archive,
        ladder: discovery,
        cost: low,
        routes: { http: ["GET boardgamegeek.com/xmlapi2/thing"] },
      }

  # Local FOSS tools.
  ytdlp:
    pool: null
    wired: true
    keyed: false
    capabilities:
      transcript: {
        paradigm: structured-extraction,
        ladder: fetch,
        cost: low,
        routes: { local: ["yt-dlp --write-subs"] },
      }
  pdftotext:
    pool: null
    wired: true
    keyed: false
    capabilities:
      extract: {
        paradigm: structured-extraction,
        ladder: fetch,
        cost: low,
        routes: { local: ["pdftotext"] },
      }
  ocr:
    pool: null
    wired: true
    keyed: false
    capabilities:
      read: {
        paradigm: structured-extraction,
        ladder: fetch,
        cost: low,
        routes: { cli: ["toolbox azure docintel"] },
      } # F0 2-page windows; S0 on >4 MB or F0 403 (~$0.0015/page)
  playwright:
    pool: null
    wired: true
    keyed: false
    capabilities:
      render: {
        paradigm: browser-unlocker,
        ladder: fetch,
        cost: med,
        routes: { local: ["playwright"] },
      }
