name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pytest suites
        run: uv run --project . pytest -q

      - name: Node tests
        run: node --test rigorous-planning/scripts/planning.test.mjs
