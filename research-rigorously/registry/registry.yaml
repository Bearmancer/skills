# Routing registry: source of truth for surfaces. references/routing.md is generated from this file
# (rr gen-routing). Surface id = <server>.<capability>.
# Route order inside one capability: mcp, then cli, then post, then http or a local tool.
# MCP routes belong only to surfaces an agent answers (fetch and discovery asks); Python never calls MCP.
# Fallback inside a server is never a new surface. `auth` says how the CLI authenticates when it is not just `key.env`.
schema: 1

# Rotation paradigms for discovery rounds. Round N must use a paradigm not used in earlier rounds.
paradigms: [
  keyword,
  semantic,
  answer-agent,
  scholarly-archive,
  crawl-map,
  browser-unlocker,
  structured-extraction,
]
round_order:
  - [keyword]
  - [semantic, answer-agent]
  - [scholarly-archive, crawl-map, browser-unlocker, structured-extraction]
max_rounds: 3

# Fetch ladder: escalate per URL on block, cheap to expensive.
fetch_ladder:
  - direct.fetch
  - tavily.extract
  - exa.fetch
  - wayback.fetch
  - scrapegraph.scrape
  - zenrows.fetch
  - tinyfish.fetch
  - firecrawl.fetch
  - brightdata.scrape
  - apify.rag-web-browser

# Source tiers by type. Per-domain overrides go in tier_overrides.
tiers:
  T1: [
    rulebook,
    official-data,
    original-document,
    peer-reviewed,
    designer-post,
    publisher-post,
    direct-record,
  ]
  T2: [established-outlet, reference-work, quality-journalism]
  T3: [forum, blog, social, unknown]
tier_overrides: {}

servers:
  direct:
    pool: null
    wired: true
    keyed: false
    capabilities:
      fetch: {
        paradigm: crawl-map,
        ladder: fetch,
        cost: low,
        routes: { http: ["GET <url>"] },
      }

  tavily:
    pool: tavily
    auth: "MCP tools read TAVILY_API_KEY from the host config; the tvly CLI is broken on this host and stays the fallback"
    wired: true
    keyed: true
    key: {
      env: TAVILY_API_KEY,
      pattern: "^(?P<acct>[A-Z0-9]+)_TAVILY_API_KEY$",
      header: "Authorization",
      prefix: "Bearer ",
      base_url: "https://api.tavily.com",
    }
    mcp_key: { env: TAVILY_API_KEY }
    reset: monthly # https://help.tavily.com/articles/6846808029-understanding-api-credits-reset (first day of each month)
    capabilities:
      search: {
        paradigm: keyword,
        ladder: discovery,
        cost: low,
        routes: { mcp: [tavily_search], cli: ["tvly search"] },
      }
      extract: {
        paradigm: crawl-map,
        ladder: fetch,
        cost: low,
        routes: {
          mcp: [tavily_extract],
          cli: ["tvly extract <url...(max 20)> --json -o <file>"],
        },
      }
      crawl: {
        paradigm: crawl-map,
        ladder: discovery,
        cost: med,
        routes: { mcp: [tavily_crawl, tavily_map], cli: ["tvly crawl", "tvly map"] },
      }
      research: {
        paradigm: answer-agent,
        ladder: discovery,
        cost: high,
        routes: { mcp: [tavily_research], cli: ["tvly research run"] },
      }
    errors:
      blocked: ["failed to fetch url"]
    unverified: [bad_key, out_of_credit, rate_limit]

  exa:
    pool: exa
    auth: "MCP tools read EXA_API_KEY from the host config; the POST scripts are the fallback"
    wired: true
    keyed: true
    key: {
      env: EXA_API_KEY,
      pattern: "^(?P<acct>[A-Z0-9]+)_EXA_API_KEY$",
      header: "x-api-key",
      prefix: "",
      base_url: "https://api.exa.ai",
    }
    mcp_key: { env: EXA_API_KEY }
    reset: monthly # https://exa.ai/docs/reference/billing (monthly credits expire at month end)
    capabilities:
      search: {
        paradigm: semantic,
        ladder: discovery,
        cost: low,
        routes: {
          mcp: [web_search_exa],
          post: [
            "uv run <skill dir>/rr.py vendor exa POST /search --body <json|@file>",
          ],
        },
      }
      fetch: {
        paradigm: crawl-map,
        ladder: fetch,
        cost: low,
        routes: {
          mcp: [web_fetch_exa],
          post: [
            "uv run <skill dir>/rr.py vendor exa POST /contents --body <json|@file>",
          ],
        },
      }
      answer: {
        paradigm: answer-agent,
        ladder: discovery,
        cost: med,
        routes: {
          post: [
            "uv run <skill dir>/rr.py vendor exa POST /answer --body <json|@file>",
          ],
        },
      }
      agent: {
        paradigm: answer-agent,
        ladder: discovery,
        cost: high,
        routes: {
          mcp: [agent_run],
          post: [
            "uv run <skill dir>/rr.py vendor exa POST /agent/runs --body <json|@file>",
            "uv run <skill dir>/rr.py vendor exa GET /agent/runs/<run_id>",
            "uv run <skill dir>/rr.py vendor exa-agent-run stop|cancel <run_id>",
            "uv run <skill dir>/rr.py vendor exa-batches start|status|cancel",
          ],
        },
      }
    errors:
      bad_key: ["401"]
      out_of_credit: ["402"]
      blocked: ["source_not_available"]
      rate_limit: ["429"]

  scrapegraph:
    pool: scrapegraph
    auth: "SGAI_API_KEY (just-scrape); debug with SGAI_DEBUG=1, history with `just-scrape history scrape --json`"
    wired: true
    keyed: true
    key: {
      env: SGAI_API_KEY,
      pattern: "^(?P<acct>[A-Z0-9]+)_(SCRAPEGRAPH|SCRAPEGRAPHAI)_API_KEY$",
      header: "SGAI-APIKEY",
      prefix: "",
      base_url: "https://v2-api.scrapegraphai.com/api",
    }
    mcp_key: { env: SGAI_API_KEY }
    reset: unknown # no vendor doc found stating the free-credit reset (docs.scrapegraphai.com pricing page unclear)
    capabilities:
      search: {
        paradigm: keyword,
        ladder: discovery,
        cost: med,
        routes: { mcp: [search], cli: ["just-scrape search"] },
      }
      scrape: {
        paradigm: structured-extraction,
        ladder: fetch,
        cost: med,
        routes: { mcp: [scrape, extract], cli: ["just-scrape scrape <url>"] },
      }
      crawl: {
        paradigm: crawl-map,
        ladder: discovery,
        cost: high,
        routes: {
          mcp: [crawl_start, crawl_get, crawl_pages, crawl_stop, crawl_resume, crawl_delete],
          cli: ["just-scrape crawl"],
          post: [
            "uv run <skill dir>/rr.py vendor scrapegraph-crawl start|status|stop|resume|delete|pages",
          ],
        },
      }
    errors:
      bad_key: ["401", "auth_missing_key", "403", "auth_invalid_key"]
      out_of_credit: ["402", "insufficient_credits"]
      rate_limit: ["429", "rate_limited"]
    unverified: [blocked]

  firecrawl:
    pool: firecrawl
    auth: "MCP tools read FIRECRAWL_API_KEY from the host config; the firecrawl CLI is the fallback (`firecrawl --status` reports auth and credits)"
    wired: true
    keyed: true
    key: {
      env: FIRECRAWL_API_KEY,
      pattern: "^(?P<acct>[A-Z0-9]+)_FIRECRAWL_API_KEY$",
      header: "Authorization",
      prefix: "Bearer ",
      base_url: "https://api.firecrawl.dev",
    }
    mcp_key: { env: FIRECRAWL_API_KEY }
    reset: monthly # https://docs.firecrawl.dev/billing (free plan 1,000 credits, resets each monthly cycle)
    capabilities:
      search: {
        paradigm: keyword,
        ladder: discovery,
        cost: low,
        routes: { mcp: [firecrawl_search], cli: ["firecrawl search"] },
      } # 2 credits / 10 results
      fetch: {
        paradigm: browser-unlocker,
        ladder: fetch,
        cost: med,
        routes: { mcp: [firecrawl_scrape], cli: ["firecrawl scrape <url>"] },
      } # 1 credit / page
      map: {
        paradigm: crawl-map,
        ladder: discovery,
        cost: low,
        routes: { mcp: [firecrawl_map], cli: ["firecrawl map"] },
      } # 1 credit / call
    errors:
      bad_key: ["401"]
      out_of_credit: ["402"]
      rate_limit: ["429"]
    unverified: [blocked]

  apify:
    pool: apify
    auth: "APIFY_TOKEN (`apify info` reports token source env; no ~/.apify/auth.json: never run `apify login`)"
    wired: true
    keyed: true
    key: {
      env: APIFY_TOKEN,
      pattern: "^(?P<acct>[A-Z0-9]+)_APIFY_TOKEN$",
      header: "Authorization",
      prefix: "Bearer ",
      base_url: "https://api.apify.com/v2",
    }
    mcp_key: { env: APIFY_TOKEN }
    reset: monthly # https://docs.apify.com/account/subscriptions (prepaid usage resets every billing cycle)
    capabilities:
      rag-web-browser: {
        paradigm: browser-unlocker,
        ladder: fetch,
        cost: med,
        routes: {
          mcp: [apify--rag-web-browser],
          cli: ["apify actors call apify/rag-web-browser"],
        },
      }
      actor: {
        paradigm: structured-extraction,
        ladder: fetch,
        cost: high,
        routes: {
          mcp: [search-actors, fetch-actor-details, call-actor, get-dataset-items],
          cli: ["apify actors search", "apify actors call"],
        },
      }
    errors:
      bad_key: ["401", "invalid-token", "token-not-provided"]
      out_of_credit: [
        "402",
        "not-enough-usage-to-run-paid-actor",
        "monthly-usage-limit-too-low",
      ]
      rate_limit: ["429", "rate-limit-exceeded"]
    unverified: [blocked]

  zenrows:
    pool: zenrows
    wired: true
    keyed: true
    auth: "MCP tools read ZENROWS_API_KEY from the host config; the zenrows CLI is the fallback (no ~/.zenrows/secrets.json: a stored key would win; never run `zenrows login`)"
    key: {
      env: ZENROWS_API_KEY,
      pattern: "^(?P<acct>[A-Z0-9]+)_ZENROWS_API_KEY$",
      header: null,
      prefix: "",
      base_url: null,
    }
    mcp_key: { env: ZENROWS_API_KEY }
    reset: unknown
    capabilities:
      fetch: {
        paradigm: browser-unlocker,
        ladder: fetch,
        cost: med,
        routes: { mcp: [scrape], cli: ["zenrows fetch <url>"] },
      } # HTML; ~$0.01 per call; run artifacts in ~/.zenrows/runs/<run-id>
    unverified: [bad_key, out_of_credit, blocked, rate_limit]

  tinyfish:
    pool: tinyfish
    wired: true
    keyed: true
    auth: "TINYFISH_API_KEY (overrides a key saved with `tinyfish auth set`); check `tinyfish auth status`"
    key: {
      env: TINYFISH_API_KEY,
      pattern: "^(?P<acct>[A-Z0-9]+)_TINYFISH_API_KEY$",
      header: null,
      prefix: "",
      base_url: null,
    }
    mcp_key: { env: TINYFISH_API_KEY }
    reset: unknown
    capabilities:
      fetch: {
        paradigm: browser-unlocker,
        ladder: fetch,
        cost: med,
        routes: {
          mcp: [fetch_content],
          cli: ["tinyfish fetch content get <url>"],
        },
      } # JSON: title, author, text (markdown)
    unverified: [bad_key, out_of_credit, blocked, rate_limit]

  brightdata:
    pool: brightdata
    wired: true
    keyed: true
    auth: "BRIGHTDATA_API_KEY plus a Web Unlocker zone: pass --zone or `brightdata config set default_zone_unlocker cli_unlocker`"
    key: {
      env: BRIGHTDATA_API_KEY,
      pattern: "^(?P<acct>[A-Z0-9]+)_BRIGHTDATA_API_KEY$",
      header: null,
      prefix: "",
      base_url: null,
    }
    mcp_key: { env: BRIGHTDATA_API_KEY }
    reset: unknown
    capabilities:
      scrape: {
        paradigm: browser-unlocker,
        ladder: fetch,
        cost: high,
        routes: {
          mcp: [web_fetch],
          cli: ["brightdata scrape <url> --zone cli_unlocker"],
        },
      } # -f markdown|html|screenshot|json, --country, --mobile, --async, -o
    errors:
      bad_key: ["401", "api key required", "No API key found"]
    unverified: [out_of_credit, blocked, rate_limit]

  # Browserbase removed: no MCP equivalent; its pool and POST script are gone.

  microsoft-learn:
    pool: null
    wired: true
    keyed: false
    mcp_key: { keyless: true }
    capabilities:
      docs: {
        paradigm: keyword,
        ladder: discovery,
        cost: low,
        routes: {
          mcp: [microsoft_docs_search, microsoft_docs_fetch],
          http: ["GET learn.microsoft.com/api/search?search=<q>", "GET <hit url>"],
        },
      }

  # The official reference fetch server (keyless). Wayback and Wikisource take
  # its `fetch` tool as their MCP route, with their HTTP routes as fallback.
  fetch:
    pool: null
    wired: true
    keyed: false
    mcp_key: { keyless: true }
    capabilities: {}

  # Free lawful surfaces (no key).
  openalex:
    pool: null
    wired: true
    keyed: false
    capabilities:
      search: {
        paradigm: scholarly-archive,
        ladder: discovery,
        cost: low,
        routes: { http: ["GET api.openalex.org/works"] },
      }
  crossref:
    pool: null
    wired: true
    keyed: false
    capabilities:
      search: {
        paradigm: scholarly-archive,
        ladder: discovery,
        cost: low,
        routes: { http: ["GET api.crossref.org/works"] },
      }
  semantic-scholar:
    pool: null
    wired: true
    keyed: false
    capabilities:
      search: {
        paradigm: scholarly-archive,
        ladder: discovery,
        cost: low,
        routes: { http: ["GET api.semanticscholar.org/graph/v1/paper/search"] },
      }
  arxiv:
    pool: null
    wired: true
    keyed: false
    capabilities:
      search: {
        paradigm: scholarly-archive,
        ladder: discovery,
        cost: low,
        routes: { http: ["GET export.arxiv.org/api/query"] },
      }
  unpaywall:
    pool: null
    wired: true
    keyed: false
    capabilities:
      lookup: {
        paradigm: scholarly-archive,
        ladder: discovery,
        cost: low,
        routes: { http: ["GET api.unpaywall.org/v2/<doi>"] },
      }
  wayback:
    pool: null
    wired: true
    keyed: false
    capabilities:
      fetch: {
        paradigm: scholarly-archive,
        ladder: fetch,
        cost: low,
        routes: {
          mcp: ["fetch.fetch"],
          http: [
            "GET archive.org/wayback/available",
            "GET web.archive.org/cdx/search/cdx",
          ],
        },
      }
  internet-archive:
    pool: null
    wired: true
    keyed: false
    capabilities:
      fulltext: {
        paradigm: scholarly-archive,
        ladder: discovery,
        cost: low,
        routes: { http: ["GET archive.org/advancedsearch.php"] },
      }
  wikisource:
    pool: null
    wired: true
    keyed: false
    capabilities:
      search: {
        paradigm: scholarly-archive,
        ladder: discovery,
        cost: low,
        routes: {
          mcp: ["fetch.fetch"],
          http: ["GET wikisource.org/w/api.php"],
        },
      }
  wikidata:
    pool: null
    wired: true
    keyed: false
    capabilities:
      query: {
        paradigm: semantic,
        ladder: discovery,
        cost: low,
        routes: { http: ["GET wikidata.org/w/api.php"] },
      }
  bgg:
    pool: null
    wired: true
    keyed: false
    capabilities:
      xmlapi: {
        paradigm: scholarly-archive,
        ladder: discovery,
        cost: low,
        routes: { http: ["GET boardgamegeek.com/xmlapi2/thing"] },
      }

  # Local FOSS tools.
  # yt-dlp is installed as a uv tool (`uv tool install yt-dlp`), so its exe is on PATH.
  ytdlp:
    pool: null
    wired: true
    keyed: false
    capabilities:
      transcript: {
        paradigm: structured-extraction,
        ladder: fetch,
        cost: low,
        routes: { local: ["yt-dlp --write-subs"] },
      }
  ocr:
    pool: null
    wired: true
    keyed: false
    capabilities:
      read: {
        paradigm: structured-extraction,
        ladder: fetch,
        cost: low,
        routes: { cli: ["toolbox azure docintel"] },
      } # F0 2-page windows; S0 on >4 MB or F0 403 (~$0.0015/page)
