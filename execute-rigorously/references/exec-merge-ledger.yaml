version: 1
purpose: "Every rule of the thirteen execution source skills, mapped to ENFORCED, MERGED, SKIPPED or DEFERRED with a reason. Sources are labelled neutrally. check --pack verifies every enforced script reference points at a real rule or gate."
sources:
  E1: ticket implement
  E2: integration-branch implementation with implementer and merger subagents
  E3: incremental implementation
  E4: implementer subagent prompt
  E5: canonical execute workflow
  E6: inline plan execution with ledger
  E7: "orchestrated plan executor with state, evidence ledger and worktrees"
  E8: persistence loop with story list and feedback baseline
  E9: source-driven development
  E10: spec-driven development
  E11: test-first loop with seams
  E12: questionnaire for someone else
  E13: test-driven development
dispositions:
  enforced: "a script rule or gate fails when broken (script), a written contract the agent follows (contract), or a detective check afterwards (detective)"
  merged: "folded into another row, file or planning rule"
  skipped: "deliberately not carried over; reason required"
  deferred: "parked for the user or a named later skill; reason required"
rows:
  - id: X001
    src: E1
    rule: "Fetch the work item and state its title before starting; ask if the reference is ambiguous"
    rel: shared
    disp: enforced
    by: contract
    ref: "execute.yaml#stages.implement"
  - id: X002
    src: E1
    rule: Use test-first where possible at pre-agreed seams
    rel: shared
    disp: enforced
    by: script
    ref: X_evidence
  - id: X003
    src: E1
    rule: "Typecheck regularly, run single test files regularly, full suite once at the end"
    rel: shared
