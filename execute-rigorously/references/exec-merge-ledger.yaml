conflicts:
  - id: branch
    rows:
      - X005
    resolution: "Commits go to the run branch in a worktree; the current branch and main checkout are never edited. Delivery beyond the branch is the user choice in XQ2."
    decided_by: user
    decision: "Implied by the delivery answer: commit, push, squash merge, delete local and remote branch."
  - id: worktree
    rows:
      - X012
      - X110
    resolution: "One worktree and branch (rigor/<slug>) per plan. Phases are checkpoints inside it. No lane worktrees."
    decided_by: user
    decision: One worktree per plan.
  - id: delivery
    rows:
      - X133
    resolution: "Nothing leaves the worktree except what the user chose in XQ2 (branch only, draft pull request, or push + PR + squash merge + delete local and remote branch). finish performs exactly that and stops on any failure."
    decided_by: user
    decision: "Commit, push, squash merge, delete local and remote branch."
  - id: ruling
    rows:
      - X070
    resolution: "Rulings are allowed only where the spec or plan already decides; they are ledgered as decisions with reason, cost if wrong, and authority. A choice they do not decide is a question; independent tasks continue, dependent tasks are blocked."
    decided_by: user
    decision: Rule only where spec or plan decides.
  - id: rereview
    rows:
      - X094
    resolution: "Each fix is proven test-first. A re-review follows, sized to the share of the branch that changed since the reviewed head (none, lint-only, targeted, full), at most 3 rounds per reviewer."
    decided_by: user
    decision: "Sized to the change; maximum 3 rounds."
  - id: orch
    rows:
      - X102
    resolution: "Topology scales with plan size. Two modes only: inline for small plans, one subagent per task for larger ones. When subagents implement, the orchestrator never edits product files. Verification and review are always a different context."
    decided_by: user
    decision: Scaled by plan size.
  - id: verifier
    rows:
      - X126
    resolution: "One independent verifier pass per wave or phase, not per task. Verdicts: confirmed, false-positive, needs-fix, needs-human-review. Only confirmed passes."
    decided_by: user
    decision: Per wave or phase plus whole branch.
  - id: retry
    rows:
      - X127
    resolution: "Cap of three attempts per task, stop on the same failure signature twice, stop after 240 minutes; one free repair for harness failures."
    decided_by: user
    decision: Keep these numbers.
  - id: loop
    rows:
      - X140
    resolution: "Bounded loop. The run ends in finish, or with blocked tasks reported. No unbounded persistence."
    decided_by: user
    decision: Covered by the retry answer (keep the caps and stops).
  - id: resume
    rows:
      - X140
    resolution: "A stale heartbeat marks the run interrupted; the next exec start resumes it on the same worktree and branch. A live run is refused. Completion is never inferred from git state."
    decided_by: user
    decision: "Earlier answer: continue an interrupted run, refuse if live."
  - id: plan
    rows:
      - X191
    resolution: "Execution never edits the plan or spec. A needed change is a question to the user and a logged plan_change; X_deviation fails the run otherwise."
    decided_by: user
    decision: "Block affected tasks and ask; plan untouched."
