version: 1
purpose: "Independent proposal audit. Every proposal in plan.proposals is audited before any reviewer sees the plan. External claims need two different tools; internal claims use codegraph and the code."
independence:
  - "The auditor is a fresh subagent. It receives the claim text only, never the planner reasoning."
  - "Each tool run is saved to .rigor/evidence/<proposal-id>/<tool>.md. The gate reads these files; a snippet is not evidence."
  - "A source counts only when its full content was returned (at least min_chars) and at least one evidence item is a primary source (official docs, standard, project repo)."
verdicts:
  supported: two different tools returned matching evidence including a primary source
  contradicted: "evidence refutes the claim; replace the proposal"
  unverifiable: "fewer than two tools could retrieve evidence; the proposal becomes blocked_on a question"
audit_record_fields:
  - auditor
  - saw_planner_reasoning
  - verdict
  - evidence
evidence_item_fields:
  - tool
  - command
  - url
  - file
  - primary
tools:
  firecrawl:
    use:
      - search
      - fetch
    search: "firecrawl search \"<query>\""
    fetch: "firecrawl scrape <url> --format markdown"
    syntax: from the firecrawl skill text
  brightdata:
    use:
      - search
      - fetch
      - discover
    search: "brightdata search \"<query>\""
    fetch: "brightdata scrape <url>"
    discover: "brightdata discover \"<query>\""
    syntax: "from the help text the user supplied; run brightdata --help first"
  tavily:
    binary: tvly
    use:
      - search
      - fetch
    search: "tvly --json search \"<query>\""
    fetch: "tvly --json extract <url>"
    syntax: "Commands and the global --json flag come from the user-supplied help text. Per-command flags are not shown there: run tvly search --help before first use."
  just-scrape:
    note: ScrapeGraphAI CLI
    use:
      - search
      - fetch
    search: "just-scrape search \"<query>\""
    fetch: "just-scrape scrape <url>"
    syntax: Commands come from the user-supplied help text (scrape accepts a format such as markdown). Run just-scrape scrape --help before first use to confirm the format flag.
  apify:
    use:
      - fetch
    discover: "apify actors search \"<query>\""
    fetch: "apify call <actor>"
    syntax: "Commands come from the user-supplied help text. Fetching needs a named Actor, so prefer apify as a corroborating third tool. Run apify call --help before first use."
  codegraph:
    use:
      - internal
    index:
      - codegraph init
      - codegraph sync
    query: "codegraph query \"<symbol>\""
    detail:
      - "codegraph node <name>"
      - "codegraph callers <symbol>"
      - "codegraph callees <symbol>"
      - "codegraph impact <symbol>"
      - "codegraph explore \"<query>\""
    syntax: Commands come from the user-supplied help text. Run codegraph query --help before first use to confirm flags.
  code:
    use:
      - internal
    syntax: read the file directly or use text search
internal_tools:
  - codegraph
  - code
excluded:
  agentql: "CLI offers only init and new-script, so it cannot search or fetch pages for auditing. Revisit if a query command is added."
on_too_few_tools: "Stop and ask. Fewer than two external audit tools available is a blocking question, not a silent downgrade."
platform_note: Use whichever of python3 or python exists. On Windows an executable such as brightdata.exe resolves as brightdata.
limits_note: "minimum tool count and evidence size: limits.yaml planning.audit"
