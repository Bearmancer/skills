version: 1
purpose: "Who does the work and who reviews it, scaled by size and risk. Reviews are always independent subagents and happen at large scale (whole plan), never per task."
planner:
  note: "Inline or one planner subagent: thresholds in limits.yaml planning.delegation. Estimate tasks and surfaces after ground. A surface is an independently deployable or ownable area of the system; the plan names it on every task."
researchers:
  roles:
    explorer: "repo patterns, callers, tests, reuse (codegraph first, then text search)"
    gap_analyst: "hidden requirements, edge cases, failure modes against the ideal state"
    auditor: "independent proposal audit; sees only the claim (see audit-tools.yaml)"
  max_rounds_note: "maximum review rounds: limits.yaml planning.review.rounds_per_role"
reviewers:
  critic:
    when: tier is 1 or 2
    checks:
      - testable acceptance
      - concrete verification
      - risk mitigation
      - fair alternatives
      - vague wording
      - scope conservation
      - vertical slicing
  architect:
    when: "tier is 2, or risk signals include interface_change, module_boundary, cross_cutting, schema_change"
    must_provide:
      - strongest steelman antithesis to the favoured option
      - at least one real tradeoff tension
      - a synthesis when possible
  data_lens:
    when: "risk signals include schema_change, data_migration, destructive_or_irreversible"
    checks:
      - rollback
      - data safety
      - ordering of migration tasks
  verification_lens:
    when: risk signals include weak_verification
    checks:
      - evidence path can establish or refute each claim
      - affordance lifecycle
contract:
  independent: true
  rules:
    - A reviewer is a fresh subagent with only the plan and spec files.
    - The critic never sees the architect output and the reverse.
    - "Only the planner merges findings, after every required review has finished."
    - Each finding is logged as a review_finding event and ends accepted or rejected with a reason.
    - "If no subagent can be spawned, the review gate is recorded failed(no subagent). It is never silently degraded."
  bounded_convergence: stop early on a round that raises no new blocking finding and closes none from the ledger
re_review:
  note: Sized to the change since the last full review (state.review_baseline).
  none: no task changed
  lint_only: "few changed tasks, none on the critical path (ratio: limits.yaml planning.review.re_review)"
  targeted: "a moderate share of tasks changed, none on the critical path; one critic subagent on the delta (ratio: limits.yaml)"
  full: "more than the targeted share changed, or any critical-path task changed, or a phase added or removed"
