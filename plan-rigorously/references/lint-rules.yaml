version: 1
purpose: Declarative rules evaluated by railguard check. Each id has a Python implementation of the same name; check --pack fails if either side is missing. from_tier is the lowest tier that runs the rule.
rules:
  - id: R_tier_floor
    sev: error
    from_tier: 0
    gate: G_route
    check: "meta.tier is not below the floor derived from risk signals (tier 2) and from task and surface counts (tier 1)"
    fix: "raise meta.tier, or remove the risk signal with a recorded reason"
  - id: R_meta
    sev: error
    from_tier: 0
    gate: G_route
    check: "plan.meta has slug, status, tier (0-2), type, spec; type is implementation, design, debug, rollout, eval or pr-split"
    fix: "fill meta"
  - id: R_requirements_present
    sev: error
    from_tier: 0
    gate: G_requirements
    check: "spec has problem, solution, success_criteria; spec slug equals plan slug"
    fix: "complete spec.yaml"
  - id: R_requirements_clean
    sev: error
    from_tier: 0
    gate: G_requirements
    check: "spec holds no file path and no code fence outside spec.prototype_snippets"
    fix: "replace paths with anchors"
  - id: R_user_stories
    sev: error
    from_tier: 1
    gate: G_requirements
    check: "user stories meet the tier minimum and read As a X I want Y so that Z"
    fix: "add stories"
  - id: R_seams
    sev: error
    from_tier: 1
    gate: G_requirements
    check: "test seams exist and every seam is confirmed by the user"
    fix: "ask the user to confirm seams"
  - id: R_ideal_gaps
    sev: error
    from_tier: 1
    gate: G_scope
    check: "ideal_state rows and gaps with reasons exist"
    fix: "write ideal state then gaps"
  - id: R_scope_conservation
    sev: error
    from_tier: 0
    gate: G_scope
    check: "every gap is covered by at least one task; every task covers a gap or names what it enables"
    fix: "add or re-map tasks"
  - id: R_scope_words
    sev: error
    from_tier: 0
    gate: G_scope
    check: "no mvp, v1, v2, later, future work, deferred, stretch in titles or acceptance"
    fix: "schedule the work in a phase or record a user-authorized out_of_scope"
  - id: R_task_fields
    sev: error
    from_tier: 0
    gate: G_tasks
    check: "each task has unique id, title, size XS-M, depends, acceptance, verify, files, interfaces"
    fix: "complete the task"
  - id: R_task_size
    sev: error
    from_tier: 0
    gate: G_tasks
    check: "no task is L or XL"
    fix: "split the task"
  - id: R_task_files
    sev: error
    from_tier: 1
    gate: G_tasks
    check: "files per task within limits.yaml planning.task.files; each has relative path, op create or modify, verified_at"
    fix: "list real files"
  - id: R_task_split_hints
    sev: warn
    from_tier: 1
    gate: G_tasks
    check: "acceptance bullets or surfaces per task over limits.yaml planning.task, or the word and in a title"
    fix: "consider splitting"
  - id: R_task_surfaces
    sev: error
    from_tier: 1
    gate: G_tasks
    check: "every task names its surfaces as a non-empty list; execution counts the distinct names"
    fix: "add surfaces: [name] to the task"
  - id: R_verify_paths
    sev: error
    from_tier: 1
    gate: G_tasks
    check: "tasks of size S or M have a happy and a failure verify; each verify has run and expect"
    fix: "add verify entries"
  - id: R_decision_complete
    sev: error
    from_tier: 0
    gate: G_tasks
    check: "no TBD, TODO, handle edge cases, as needed, etc in task text"
    fix: "decide it"
  - id: R_interfaces
    sev: error
    from_tier: 1
    gate: G_tasks
    check: "every consumed interface is produced by a transitive dependency or listed in plan.external_interfaces"
    fix: "fix names or dependencies"
  - id: R_constraints
    sev: error
    from_tier: 1
    gate: G_tasks
    check: "plan.constraints is non-empty"
    fix: "copy constraints verbatim from the request"
  - id: R_review_focus
    sev: error
    from_tier: 1
    gate: G_tasks
    check: "1 to 5 review_focus entries each pinned to an existing task"
    fix: "add entries"
  - id: R_proportion
    sev: warn
    from_tier: 1
    gate: G_tasks
    check: "plan text is not many times longer than the spec"
    fix: "replace bodies with signatures and assertions"
  - id: R_must_not
    sev: error
    from_tier: 1
    gate: G_tasks
    check: "must_not_have is non-empty"
    fix: "list guardrails against unrequested additions"
  - id: R_quality_ratio
    sev: error
    from_tier: 1
    gate: G_tasks
    check: "enough evidence_ledger facts have a source and enough acceptance bullets are proved by a verify entry (shares in limits.yaml planning.evidence_facts and planning.acceptance_bullets)"
    fix: "cite or add verify"
  - id: R_files_exist
    sev: error
    from_tier: 1
    gate: G_tasks
    check: "modify paths exist and create paths have an existing parent when the repo is present"
    fix: "correct the path"
  - id: R_anchors
    sev: error
    from_tier: 1
    gate: G_tasks
    check: "each task anchor is declared in spec and resolved in plan.resolved_anchors with path, commit, verified_at and not stale"
    fix: "run codegraph sync and re-resolve"
  - id: R_deps_valid
    sev: error
    from_tier: 0
    gate: G_order
    check: "dependencies exist; no cycle; no dependency on a later phase"
    fix: "reorder"
  - id: R_checkpoints
    sev: error
    from_tier: 1
    gate: G_order
    check: "every phase ends with a checkpoint and no more tasks than limits.yaml planning.checkpoint.tasks_between pass between checkpoints"
    fix: "add checkpoints"
  - id: R_evidence_path
    sev: error
    from_tier: 1
    gate: G_evidence
    check: "claims with owner task; the minimum candidate paths in limits.yaml planning.evidence_path with exactly one chosen; test_strategy set"
    fix: "complete evidence_path"
  - id: R_evidence_budget
    sev: error
    from_tier: 1
    gate: G_evidence
    check: "each claim has exactly one owner task that exists"
    fix: "assign owners"
  - id: R_affordance
    sev: error
    from_tier: 1
    gate: G_evidence
    check: "each affordance has lifecycle temporary or durable and an owner task"
    fix: "state lifecycle"
  - id: R_final_verification
    sev: error
    from_tier: 1
    gate: G_evidence
    check: "final_verification items cover every claim"
    fix: "add final rows"
  - id: R_questions
    sev: error
    from_tier: 0
    gate: G_questions
    check: "each question has id, text, why_not_discoverable, options with a recommended one, blocking flag, status; answered ones have an answer"
    fix: "complete questions"
  - id: R_blocked
    sev: error
    from_tier: 0
    gate: G_questions
    check: "no blocking question open at final; blocked_on refers to open questions; not every task is blocked"
    fix: "ask the user"
  - id: R_proposal_audit
    sev: error
    from_tier: 0
    gate: G_audit
    check: "each proposal has an independent audit with 2 distinct tools and saved evidence files of sufficient size"
    fix: "run the audit"
  - id: R_tier2_sections
    sev: error
    from_tier: 2
    gate: G_tier2
    check: "options summary, 3-scenario premortem, test plan with unit, integration, e2e, observability"
    fix: "complete tier 2 sections"
  - id: R_reviews_done
    sev: error
    from_tier: 1
    gate: G_review
    check: "reviewers required by routing approved the current plan hash at the level the change size requires"
    fix: "run the review"
  - id: R_review_rounds
    sev: error
    from_tier: 1
    gate: G_review
    check: "no reviewer exceeded the round cap (limits.yaml)"
    fix: "present best version and record non-consensus"
  - id: R_ledger_chain
    sev: error
    from_tier: 0
    gate: G_ledger
    check: "ledger hash chain is intact"
    fix: "do not edit the ledger by hand"
  - id: R_ledger_reasons
    sev: error
    from_tier: 0
    gate: G_ledger
    check: "plan_change, skip, deviation and review_finding events carry a reason and an authority"
    fix: "log with --reason and --authority"
  - id: R_no_impl
    sev: error
    from_tier: 0
    gate: G_no_impl
    check: "no file outside .rigor changed since the start snapshot"
    fix: "revert the stray change"
  - id: R_render_hash
    sev: error
    from_tier: 0
    gate: G_render
    check: "rendered markdown hash equals the recorded hash"
    fix: "run render"
  - id: R_published
    sev: warn
    from_tier: 0
    gate: G_publish
    check: "state.publish exists"
    fix: "run publish --yes or skip with reason"
  - id: R_intent
    sev: error
    from_tier: 0
    gate: G_intent
    check: "spec intent has outcome, user, why now, success, constraint and out of scope, and the user gave an explicit yes after any clarifying finished"
    fix: "restate the intent and ask for an explicit yes"
  - id: R_fog
    sev: error
    from_tier: 0
    gate: G_intent
    check: "spec not_yet_specified is empty at final"
    fix: "turn each item into a question or a decision"
  - id: R_fog_test
    sev: error
    from_tier: 0
    gate: G_intent
    check: "spec fog_test is recorded; if either check failed, the clarify stage ran to a closed state"
    fix: "run the clarify stage"
  - id: R_language
    sev: error
    from_tier: 0
    gate: G_intent
    check: "spec meta.language is recorded"
    fix: "ask the user once in the front batch"
  - id: R_out_of_scope
    sev: error
    from_tier: 0
    gate: G_intent
    check: "no task title, acceptance or file touches an out-of-scope term unless the user decided a scope change"
    fix: "ask the user; log decision scope_change:<id>"
  - id: R_glossary_terms
    sev: warn
    from_tier: 0
    gate: G_intent
    check: "the plan and spec do not use a glossary term the spec says to avoid"
    fix: "use the preferred term"
  - id: R_clarify
    sev: error
    from_tier: 0
    gate: G_clarify
    check: "clarify tickets are typed, blocked_on is valid, signatures are explicit user yeses, closed tickets carry answers or research records"
    fix: "fix the clarify record"
  - id: R_adr_candidates
    sev: error
    from_tier: 1
    gate: G_sediment
    check: "each decision passing the ADR test names a file under docs/adr/ and a plan task that writes it"
    fix: "name the file in the spec and add the plan task that writes it"
  - id: R_business_facts
    sev: error
    from_tier: 1
    gate: G_sediment
    check: "each business fact names a file under docs/business/ and a plan task that writes it"
    fix: "name the file in the spec and add the plan task that writes it"
  - id: R_glossary_promotion
    sev: error
    from_tier: 1
    gate: G_sediment
    check: "promoting the glossary has a plan task that writes GLOSSARY.md"
    fix: "add the plan task that writes it"
  - id: R_proposals_confirmed
    sev: error
    from_tier: 0
    gate: G_questions
    check: "every agent proposal in the ledger has a later user confirmation by the end"
    fix: "ask the user to confirm"
  - id: R_rounds
    sev: error
    from_tier: 0
    gate: G_questions
    check: "three question rounds in a row that resolved nothing are followed by a step_back answer from the user"
    fix: "stop and tell the user something foundational may be missing"
