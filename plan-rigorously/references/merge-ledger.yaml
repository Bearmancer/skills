version: 1
purpose: "Every rule of the eight source skills, mapped to ENFORCED, MERGED, SKIPPED or DEFERRED with a reason. Sources are labelled neutrally. check --pack verifies every enforced script reference points at a real rule or gate."
sources:
  S1: task breakdown
  S2: test-first plan writing
  S3: consensus planning alias
  S4: verification planning
  S5: "strategic planner with interview, direct, consensus and review modes"
  S6: explore-first planning consultant
  S7: inline plan
  S8: spec synthesis
  S9: grilling with domain docs
  S10: intent interview
  S11: decision-map planning
  S12: decision-map planning variant
dispositions:
  enforced: "a script rule or gate fails when broken (by script), a written contract the agent follows (by contract), or a detective check after the fact (by detective)"
  merged: folded into another row or file
  skipped: "deliberately not carried over; reason required"
  deferred: "parked for a named later skill or the user; reason required"
rows:
