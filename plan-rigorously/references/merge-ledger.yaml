conflicts:
  - id: C01
    title: Mode banner and announcement text
    contradiction: Banner text was kept by some sources
    resolution: "Dropped: no mode, no banner, no announcement."
    rows:
      - M020
      - M095
  - id: C02
    title: Approval channel and stops
    contradiction: Sources pause for approval
    resolution: No approval stops. Execution authorization is asked once in the front batch and stored as execute_authorized.
    rows:
      - M019
      - M046
      - M057
      - M087
      - M090
      - M091
      - M113
      - M138
  - id: C03
    title: Where plans live
    contradiction: Several default locations
    resolution: "Plans live in .rigor/plans; runtime state in .rigor/."
    rows:
      - M010
      - M021
      - M084
      - M136
  - id: C04
    title: Inline plan versus written file
    contradiction: One source delivers inline by default
    resolution: "Always a written file; the reply summarizes and lists the deferred questions."
    rows:
      - M123
      - M139
  - id: C05
    title: Question cadence
    contradiction: "One at a time, chunked options, or no interview"
    resolution: "Ask maximally and batched at the start or end, always with the question tool; never one at a time."
    rows:
      - M073
      - M077
      - M127
      - M129
      - M147
  - id: C06
