version: 1
purpose: "Tier sets how much rigor a plan needs. Every plan is a file, at every tier. A skipped gate is always recorded with a reason; nothing is silently dropped."
choose_tier:
  T0: "one surface, few tasks, no risk signals (numbers: limits.yaml planning.tier)"
  T1: "default; more tasks or surfaces than T0 (numbers: limits.yaml planning.tier)"
  T2: "any risk signal below, or the user asked for deep rigor"
fog_test:
  rule: Before choosing a tier, state the destination in one sentence and the first three decisions precisely. If either fails, the clarifying stage runs first (automatic).
risk_signals:
  - destructive_or_irreversible
  - data_migration
  - public_interface_break
  - production_incident
  - concurrency_or_distributed_state
  - real_spend
  - schema_change
  - interface_change
  - module_boundary
  - cross_cutting
  - weak_verification
tiers:
  "0":
    name: Trivial
    skip:
      G_evidence: "trivial change, no evidence path needed"
      G_review: "trivial change, lint only"
      G_tier2: not tier 2
  "1":
    name: Standard
    skip:
      G_tier2: not tier 2
  "2":
    name: Deep
    skip: {}
    adds:
      - options summary
      - premortem
      - expanded test plan
    parked:
      - adr
definition_of_done:
  note: "Project-wide bar every task must clear, in addition to its own acceptance criteria. Default list; the user confirms it in the deferred block."
  items:
    - tests pass
    - build passes
    - lint clean
    - no leftover debug output
    - ledger entry written for the change
sizes:
  note: durations and file limits live in limits.yaml planning.task_size
  split_required:
    - L
    - XL
split_hints:
  - more than about the M duration of agent work
  - acceptance needs more bullets than limits.yaml allows
  - touches two or more independent subsystems
  - the title contains the word and
