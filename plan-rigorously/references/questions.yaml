version: 1
purpose: Ask maximally, batched, at the start or the end. Never assume. Never ask what research can answer.
filters:
  - id: F1
    test: Could collected evidence (code, codegraph, docs, web audit) answer it?
    if_yes: research it and cite; do not ask
  - id: F2
    test: Is the answer a preference, tradeoff, scope or extrinsic constraint that no evidence can reveal?
    if_yes: it is a question; classify it blocking or deferrable
no_assumptions:
  rule: There are no default-adopted decisions. A question left open becomes blocked_on for the tasks that depend on it. Independent tasks continue.
  stop_rule: If every remaining task is blocked, stop and ask. Otherwise never stop.
rounds:
  rule: Breadth-first. Ask every question whose prerequisites are settled in one call, then the next layer. Never one at a time.
  step_back: When rounds pass without progress (limits.yaml planning.question.stalled_rounds), stop, restate what is unsettled and ask what is blocking the user. Recorded as a round with a step_back answer.
  confidence: The agent may privately judge whether it understands enough to stop asking; this is a heuristic and is never recorded or used as a gate.
probe:
  rule: When an answer sounds like a buzzword or convention (modern, scalable, clean, best practice), ask what the user would actually want to see or happen.
proposals:
  rule: A decision the user delegated, or one the agent picked, is recorded with authority proposal and is not settled until the user confirms it later.
  explicit_yes: Intent confirmation, clarify destination, clarify chart and execution authorization need an explicit yes; the ledger refuses anything else.
glossary:
  rule: Challenge a word that conflicts with GLOSSARY.md, sharpen vague or overloaded words into one canonical term with avoided aliases, and record each term as it resolves.
code_is_evidence:
  rule: When the code can answer, read it and cite it instead of asking; when the user's description contradicts the code, surface the contradiction as a question.
batching:
  front_batch: every blocking question, plus every deferrable question already known, in ONE structured question call
  end_batch: deferrable questions discovered later, asked together once at finalize
  answered_later: an answer triggers a delta replan of only the tasks in its blocks list, logged as plan_change with authority user
question_fields: [id, text, why_not_discoverable, options, recommended, blocking_or_deferrable, blocks, status, answer]
options_rule: Lead with the recommended option and say why. Phrase options as desired outcomes or experiences, not named libraries or methods.
owner_decision_axes:
  note: Sweep each axis once per plan. Mark it explored, asked or not applicable. These always become questions even when a reasonable choice exists.
  axes:
    - irreversible or destructive actions
    - public interface or configuration surface
    - distribution or packaging
    - new external dependency or pinned version
    - data or schema shape
    - real spend
    - expected scale or capacity
    - target audience
    - test strategy (tdd, tests_after, none)
    - test seams (prefer existing, highest possible, ideal count one)
    - definition-of-done list
    - mvp or first-release labelling (answered: no labels, ordering only; do not ask again)
    - whether execution is authorized after planning
    - whether work spanning more surfaces than one plan should hold (limits.yaml planning.task) should split into separate plans
parked:
  - clarity gate for vague execution requests: separate future skill with full-blown questioning
