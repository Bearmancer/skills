version: 1
purpose: Named exit gates. Script gates are evaluated by railguard check from lint-rules.yaml. Manual gates are recorded by the agent with railguard log --kind gate. A gate ends as passed, failed or skipped(reason, authority).
statuses: [passed, failed, skipped, pending]
skip_authority: [user, "rule:tiers"]
gates:
  - id: G_existing_plan
    stage: route
    kind: manual
    skippable: false
    what: "no existing incomplete plan was overwritten; start verb checked"
  - id: G_route
    stage: route
    kind: script
    rules: [R_meta, R_tier_floor]
    skippable: false
    what: "tier, type and spec link recorded; tier not below the derived floor"
  - id: G_ground
    stage: ground
    kind: manual
    skippable: false
    what: "codegraph init and sync attempted and logged; research complete"
  - id: G_delegates_closed
    stage: ground
    kind: manual
    skippable: false
    what: "every spawned subagent reached a terminal state; failures recorded as gaps"
  - id: G_questions
    stage: ask
    kind: script
    rules: [R_questions, R_blocked, R_proposals_confirmed, R_rounds]
    skippable: false
    what: "every question classified, answered or deferred; no blocking question open"
  - id: G_clarify
    stage: ask
    kind: script
    rules: [R_clarify]
    skippable: false
    what: "the clarify stage, if it ran, is consistent and finished"
  - id: G_audit
    stage: audit
    kind: script
    rules: [R_proposal_audit]
    skippable: false
    what: "every proposal audited independently with two tools and saved evidence"
  - id: G_requirements
    stage: requirements
    kind: script
    rules: [R_requirements_present, R_requirements_clean, R_user_stories, R_seams]
    skippable: false
    what: "spec complete, path-free, seams confirmed"
  - id: G_intent
    stage: requirements
    kind: script
    rules: [R_intent, R_fog, R_fog_test, R_language, R_out_of_scope, R_glossary_terms]
    skippable: false
    what: "intent restated and confirmed, no unspecified items, language recorded, scope and terms respected"
  - id: G_scope
    stage: requirements
    kind: script
    rules: [R_ideal_gaps, R_scope_conservation, R_scope_words]
    skippable: false
    what: "every gap has a task; no reduced-scope wording"
  - id: G_evidence
    stage: evidence
    kind: script
    rules: [R_evidence_path, R_evidence_budget, R_affordance, R_final_verification]
    skippable: true
    what: "evidence path with one owner per claim"
  - id: G_tasks
    stage: plan
    kind: script
    rules: [R_task_fields, R_task_size, R_task_files, R_task_split_hints, R_task_surfaces, R_verify_paths, R_decision_complete, R_interfaces, R_constraints, R_review_focus, R_proportion, R_must_not, R_quality_ratio, R_files_exist, R_anchors]
    skippable: false
    what: "tasks decision-complete and verifiable"
  - id: G_sediment
    stage: plan
    kind: script
    rules: [R_adr_candidates, R_business_facts, R_glossary_promotion]
    skippable: true
    what: "docs are planned as tasks that execution writes; planning writes none"
  - id: G_order
    stage: plan
    kind: script
    rules: [R_deps_valid, R_checkpoints]
    skippable: false
    what: "dependencies valid, phases consistent, checkpoints present"
  - id: G_tier2
    stage: plan
    kind: script
    rules: [R_tier2_sections]
    skippable: true
    what: "tier 2 sections present"
  - id: G_review
    stage: review
    kind: script
    rules: [R_reviews_done, R_review_rounds]
    skippable: true
    what: "required reviewers approved the current plan hash"
  - id: G_ledger
    stage: finalize
    kind: script
    rules: [R_ledger_chain, R_ledger_reasons]
    skippable: false
    what: "ledger chain intact; every change has reason and authority"
  - id: G_no_impl
    stage: finalize
    kind: script
    rules: [R_no_impl]
    skippable: false
    what: "no file outside .rigor changed since start"
  - id: G_render
    stage: finalize
    kind: script
    rules: [R_render_hash]
    skippable: false
    what: "rendered view matches recorded hash"
  - id: G_publish
    stage: finalize
    kind: script
    rules: [R_published]
    skippable: true
    what: "issues published, or skipped with reason such as no GitHub remote"
