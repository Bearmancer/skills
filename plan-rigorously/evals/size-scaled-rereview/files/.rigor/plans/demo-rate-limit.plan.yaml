# How, where, order. Paths live here, never in the spec.
meta:
  slug: demo-rate-limit
  status: draft
  tier: 1
  type: implementation
  spec: spec.yaml
  execute_authorized: false
constraints:
  - "Standard library only; no new runtime dependencies."
definition_of_done:
  - tests pass
  - build passes
  - lint clean
ideal_state:
  - id: I1
    party: API consumer
    property: "Receives a retry hint whenever limited"
    reason: "Lets clients back off without guessing"
  - id: I2
    party: Operator
    property: "Limits differ per client tier"
    reason: "Paid tiers need headroom"
gaps:
  - id: G1
    text: "No limiter exists"
    reason: "Nothing rejects excess requests today"
  - id: G2
    text: "No per-tier configuration"
    reason: "All clients would share one limit"
proposals:
  - id: P1
    kind: internal
    claim: "The handler is the single entry point for public requests."
    audit:
      auditor: subagent
      saw_planner_reasoning: false
      verdict: supported
      evidence:
        - tool: codegraph
          command: "codegraph query handler"
          file: evidence/P1/codegraph.md
          primary: true
evidence_ledger:
  - id: F1
    fact: "Handler is the single entry point"
    source: "evidence/P1/codegraph.md"
evidence_path:
  test_strategy: tdd
  claims:
    - id: C1
      text: "Excess requests are rejected with a retry hint"
      owner_task: T1
    - id: C2
      text: "Tier limits are applied"
      owner_task: T2
  paths:
    - id: EP1
      text: "Unit tests against the limiter interface"
      limits: "Does not cover the wire format"
      chosen: true
    - id: EP2
      text: "Manual curl against a running server"
      limits: "Not repeatable"
      chosen: false
  affordances:
    - name: "fake clock"
      lifecycle: durable
      owner_task: T1
questions: []
resolved_anchors:
  - id: A1
    path: src/limiter.py
    commit: abc1234
    verified_at: "2026-11-08"
    stale: false
  - id: A2
    path: src/handler.py
    commit: abc1234
    verified_at: "2026-11-08"
    stale: false
risk_signals: []
phases:
  - id: PH1
    title: "Limiter core"
    tasks:
      - id: T1
        title: "Fixed-window limiter with retry hint"
        size: S
        depends: []
        covers: [G1]
        files:
          - path: src/limiter.py
            op: create
            verified_at: "2026-11-08"
        anchors: [A1]
        interfaces:
          consumes: []
          produces: [RateLimiter]
        acceptance:
          - "Requests over the limit are rejected with a retry-after value"
          - "Requests under the limit pass"
        verify:
          - run: "python -m pytest tests/test_limiter.py -k over_limit"
            expect: "rejected with retry-after"
            kind: happy
            proves: [0]
          - run: "python -m pytest tests/test_limiter.py -k under_limit"
            expect: "passes"
            kind: failure
            proves: [1]
      - id: T2
        title: "Per-tier limits"
        size: S
        depends: [T1]
        covers: [G2]
        files:
          - path: src/handler.py
            op: modify
            verified_at: "2026-11-08"
        anchors: [A2]
        interfaces:
          consumes: [RateLimiter]
          produces: [TierConfig]
        acceptance:
          - "Each client tier uses its configured limit"
        verify:
          - run: "python -m pytest tests/test_tiers.py -k configured"
            expect: "tier limit applied"
            kind: happy
            proves: [0]
          - run: "python -m pytest tests/test_tiers.py -k unknown_tier"
            expect: "falls back to default limit"
            kind: failure
            proves: [0]
    checkpoints:
      - id: CP1
        after_task: T2
        verify: ["python -m pytest"]
final_verification:
  - id: FV1
    text: "Limiter rejects and tiers apply end to end"
    verify:
      run: "python -m pytest"
      expect: "all pass"
    proves_claims: [C1, C2]
review_focus:
  - text: "Retry hint is accurate at window edges"
    expected: "No off-by-one"
    task: T1
must_not_have:
  - "Distributed or persistent limiter state"
risks:
  - risk: "Clock skew at window boundaries"
    impact: "Occasional early rejection"
    mitigation: "Fake clock tests"
    detection: "Boundary test"
external_interfaces: []
