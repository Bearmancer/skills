# Requirements: what and why. No file paths here; name code with anchors.
meta:
  slug: demo-rate-limit
  version: 1
  language: en
intent:
  outcome: "No single client can degrade the public API for others."
  user: "API consumers, operators and maintainers."
  why_now: "A noisy client recently degraded service for everyone."
  success: "Excess requests are rejected with a retry hint; normal traffic is unchanged."
  constraint: "Limiter state sits behind one interface so the store can be swapped."
  out_of_scope: "Limiting across several servers."
fog_test:
  destination_one_sentence: true
  first_three_decisions: true
not_yet_specified: []
problem: "Public API endpoints accept unlimited requests per client, so one noisy client can degrade service for everyone."
solution: "Add a per-client request limiter in front of the public API that rejects excess requests with a clear retry hint."
success_criteria:
  - "A client exceeding its limit receives a rejection with a retry-after value."
  - "Clients under the limit see no behavior change."
user_stories:
  - "As an API consumer, I want a clear retry hint when limited, so that I can back off correctly."
  - "As an operator, I want limits configurable per client tier, so that paid tiers get more headroom."
  - "As a maintainer, I want limiter state behind one interface, so that the store can be swapped later."
decisions:
  - id: D1
    text: "Use a fixed-window counter keyed by client id."
    proposals: [P1]
test_seams:
  - id: S1
    name: "Limiter interface"
    confirmed: true
anchors:
  - id: A1
    name: "RateLimiter interface"
    kind: interface
  - id: A2
    name: "public API request handler"
    kind: symbol
out_of_scope:
  - id: O1
    text: "Rate limiting that is shared across several servers"
    terms: [cluster, distributed]
glossary:
  window:
    definition: "The fixed time span over which requests are counted."
    avoid: [bucket]
notes: []
prototype_snippets: []
